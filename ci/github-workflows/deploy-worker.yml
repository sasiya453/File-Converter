# Test and deploy the Cloudflare Worker.
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN  - API token with the "Edit Cloudflare Workers" template (Workers Scripts + KV edit)
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account id
# Worker secrets (BOT_TOKEN, WEBHOOK_SECRET, CONVERTER_URL, CONVERTER_TOKEN) are set once with
# `npx wrangler secret put` and are kept across deploys; they are NOT stored in GitHub.
# The KV namespace id must be filled in worker/wrangler.toml before the first deploy.
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Check config
        run: |
          if grep -q 'REPLACE_WITH_KV_NAMESPACE_ID' wrangler.toml; then
            echo "::error::Set the SESSIONS KV namespace id in worker/wrangler.toml (npx wrangler kv namespace create SESSIONS)"; exit 1
          fi
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
